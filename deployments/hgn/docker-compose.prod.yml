# Production overlay for a VPS that already runs nginx.
#
# Used together with the root compose file, never on its own:
#
#   docker compose -f docker-compose.yml -f deployments/hgn/docker-compose.prod.yml up -d
#
# Two things live here:
#
#  1. Keeping the bundled Caddy off ports 80/443. The proxy is kept -- it holds
#     all of the path routing (/spaces, /god-mode, /live, /api, /auth, /static,
#     the bucket, then the web app) and rebuilding that in nginx would mean
#     publishing five container ports and hand-writing every location block.
#     Instead Caddy binds to loopback on one port and the host's nginx
#     terminates TLS in front of it.
#
#  2. Health checks and real startup ordering. The root file's `depends_on` is
#     start-order only: it waits for a container to exist, not for Postgres to
#     accept connections or RabbitMQ to finish booting. In development that
#     shows up as noise in the logs; in production it means the beat scheduler
#     crash-loops on a cold boot and the operations reminders look broken when
#     the cause is a broker that was thirty seconds behind.
#
# Requires Compose v2.24+ for `!override`.
services:
  proxy:
    ports:
      # !override discards the root file's port list rather than merging with
      # it. Without this the original "80:80" and "443:443" mappings survive,
      # collide with nginx, and the stack fails to start.
      !override
      - "127.0.0.1:${LISTEN_HTTP_PORT:-8080}:80"

  # ---------------------------------------------------------------- backing services

  plane-db:
    healthcheck:
      # $$ escapes compose's own interpolation so the shell inside the
      # container expands these, not the file on the host.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  plane-redis:
    healthcheck:
      # Valkey ships valkey-cli; the redis-cli fallback covers images that only
      # provide the compatibility name.
      test: ["CMD-SHELL", "valkey-cli ping || redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  plane-mq:
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 15s
      timeout: 10s
      # RabbitMQ is the slowest thing in the stack to boot, and a first start on
      # a small VPS can take well over a minute.
      retries: 12
      start_period: 90s

  # No health check on plane-minio on purpose. `mc ready local` needs an alias
  # the image does not configure, and the /minio/health/live endpoint needs an
  # HTTP client the image does not ship. Nothing here depends on minio being
  # healthy, and a check that can never pass is worse than no check at all.

  # ------------------------------------------------------------------- application

  migrator:
    depends_on:
      !override
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy

  api:
    # The one role in this image that serves HTTP. `plane.web.urls` answers an
    # unauthenticated {"status": "OK"} at the service root. Checked with Python
    # because the image has no HTTP client, and adding one for a single request
    # is a package for a one-liner.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 5
      # collectstatic, register_instance and configure_instance all run before
      # gunicorn binds. On a cold first boot that is not quick.
      start_period: 120s
    depends_on:
      !override
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      # Rather than letting `wait_for_migrations` poll from inside the
      # container. If the migration fails, the api should not come up at all --
      # a running api on a half-migrated schema is the worst of both.
      migrator:
        condition: service_completed_successfully

  worker:
    depends_on:
      !override
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      # The broker. Missing from the root file's list, which is why a cold boot
      # fills the log with connection refusals before it settles.
      plane-mq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  beat-worker:
    depends_on:
      !override
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      # django_celery_beat keeps the schedule in the database and syncs
      # `app.conf.beat_schedule` into it on startup. Starting before the
      # migration has created those tables is a guaranteed crash loop.
      migrator:
        condition: service_completed_successfully
