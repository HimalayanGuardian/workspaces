# Workspaces (Plane fork) — host nginx vhost.
#
# Terminates TLS and hands everything to the stack's Caddy proxy on loopback.
# Caddy does the path routing internally, so there is exactly one location here.
#
#   install:  /etc/nginx/sites-available/workspaces.conf  (+ symlink to sites-enabled)
#   certs:    sudo certbot --nginx -d workspaces.example.com
#
# Replace workspaces.example.com throughout, and 8080 if you changed
# LISTEN_HTTP_PORT in the root .env.

# $connection_upgrade is not built in. It must be defined once at http{} level —
# put this in /etc/nginx/nginx.conf inside the http block, or in a file under
# /etc/nginx/conf.d/. If it is missing, nginx fails to start with
# 'unknown connection_upgrade variable', so you will find out immediately.
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }

server {
    listen 80;
    listen [::]:80;
    server_name workspaces.example.com;

    # certbot writes its own redirect here when it installs the certificate.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name workspaces.example.com;

    # certbot fills these in. Until it has run, this server block will not load —
    # bring the site up on port 80 first, then run certbot.
    ssl_certificate     /etc/letsencrypt/live/workspaces.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workspaces.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Must be at least FILE_SIZE_LIMIT from the root .env (default 5 MB).
    # nginx rejects an oversized upload before Caddy or Django ever see it,
    # and the browser only reports a generic failure — so keep the two in step.
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Django's production settings read this to decide request.is_secure().
        # Omit it and every session/CSRF cookie is issued as though the site were
        # plain HTTP, which shows up as a login that silently never completes.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Collaborative editing (/live/) is a websocket. Without the upgrade
        # headers pages load but never sync, and nothing logs an error.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
